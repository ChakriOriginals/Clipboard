name: Clipboard
options:
  bundleIdPrefix: dev.clipflow
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  ClipboardCore:
    path: Packages/ClipboardCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
targets:
  Clipboard:
    type: application
    platform: macOS
    sources:
      - Clipboard
    dependencies:
      - package: ClipboardCore
      - sdk: Carbon.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.clipflow.ClipFlow
        PRODUCT_NAME: Clipboard
        INFOPLIST_FILE: Clipboard/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Clipboard/Resources/Clipboard.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Release:
          # Never ship com.apple.security.get-task-allow (lets same-user processes attach a debugger).
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  ClipboardTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ClipboardTests
    dependencies:
      - target: Clipboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.clipflow.ClipFlowTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Clipboard:
    build:
      targets:
        Clipboard: all
        ClipboardTests: [test]
    test:
      targets:
        - ClipboardTests
      gatherCoverageData: true

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26  # Xcode 26 SDK: needed for NSGlassEffectView
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Privacy rules
        run: scripts/privacy-check.sh
      - name: Core tests (debug)
        run: make test-core
      - name: Core search performance (release)
        run: cd Packages/ClipboardCore && swift test -c release --filter SearchPerformanceTests
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: App tests
        run: make test-app
